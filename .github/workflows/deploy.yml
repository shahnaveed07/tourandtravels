name: CI — Build & SEO Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests & SEO suite
        run: npm test

      - name: Build and prerender project
        run: npm run build

      - name: Verify critical prerendered and verification artifacts in dist
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/sitemap.xml
          test -f dist/robots.txt
          test -f dist/CNAME
          test -f dist/googlefea446053fa36602.html
          test -f dist/packages/index.html
          test -f dist/bookings/index.html
          test -f dist/payments/index.html
